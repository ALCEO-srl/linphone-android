// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1' // dms: AGP 9.4 needed for compileSdk 37
        classpath 'com.android.tools.build:gradle-kotlin:9.4.1' // dms: com.android.legacy-kapt (data binding)
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}

