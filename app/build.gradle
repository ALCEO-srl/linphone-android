task generateContactsXml(type: Copy) {
    from 'contacts.xml'
    into "src/main/res/xml/"
    outputs.upToDateWhen { file('src/main/res/xml/contacts.xml').exists() }
    filter {
        line -> line
                .replaceAll('%%AUTO_GENERATED%%', 'This file has been automatically generated, do not edit or commit !')
                .replaceAll('%%PACKAGE_NAME%%', getPackageName())

    }
}
project.tasks['preBuild'].dependsOn 'generateContactsXml'


if (crashlyticsEnabled) {
    afterEvaluate {
        assembleDebug.finalizedBy(uploadCrashlyticsSymbolFileDebug)
        packageDebugBundle.finalizedBy(uploadCrashlyticsSymbolFileDebug)

        assembleReleaseWithCrashlytics.finalizedBy(uploadCrashlyticsSymbolFileReleaseWithCrashlytics)
        packageReleaseWithCrashlytics.finalizedBy(uploadCrashlyticsSymbolFileReleaseWithCrashlytics)
        // dms: the AAB (Build > Generate Signed Bundle) only uploaded the R8 mapping, not the native symbols
        bundleReleaseWithCrashlytics.finalizedBy(uploadCrashlyticsSymbolFileReleaseWithCrashlytics)
    }
}

// dms: Play Console asks for the native debug symbols, but the libraries in the linphone-sdk AAR are stripped and AGP
// can't extract them into the bundle: zip the unstripped ones from libs-debug, to upload by hand with the AAB
def nativeDebugSymbolsDir = file(LinphoneSdkBuildDir + '/libs-debug/')
tasks.register('zipNativeDebugSymbolsReleaseWithCrashlytics', Zip) {
    from(nativeDebugSymbolsDir) {
        include 'arm64-v8a/*.so'
    }
    destinationDirectory = layout.buildDirectory.dir('outputs/native-debug-symbols/releaseWithCrashlytics')
    archiveFileName = 'native-debug-symbols.zip'
    onlyIf { nativeDebugSymbolsDir.exists() }
}
afterEvaluate {
    bundleReleaseWithCrashlytics.finalizedBy(zipNativeDebugSymbolsReleaseWithCrashlytics)
}

